<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Flujo del script de reenvío de UTM entre dominios</title>
  <desc>Un anuncio lleva al usuario a una landing en un dominio de terceros con parámetros UTM en la URL. El script lee esos UTM, encuentra los links que apuntan al dominio final y los reescribe añadiendo los UTM. Al hacer clic, el usuario llega al dominio final con la campaña intacta.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #2c2c2a; }
    .ts { font-size: 12px; fill: #5f5e5a; }
    .arr { stroke: #5f5e5a; stroke-width: 1; fill: none; }
  </style>

  <!-- Row 1: Ad click -->
  <rect x="250" y="20" width="180" height="44" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.5"/>
  <text class="th" x="340" y="46" text-anchor="middle">Clic en el anuncio</text>
  <text class="ts" x="340" y="80" text-anchor="middle">URL con utm_source, utm_campaign...</text>
  <line x1="340" y1="90" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>

  <!-- Row 2: Landing de terceros container -->
  <rect x="80" y="130" width="520" height="170" rx="16" fill="#faece7" stroke="#f0997b" stroke-width="0.5"/>
  <text class="th" x="100" y="156">Landing (dominio de terceros)</text>

  <rect x="110" y="175" width="220" height="56" rx="10" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
  <text class="th" x="220" y="197" text-anchor="middle">Script lee la URL</text>
  <text class="ts" x="220" y="215" text-anchor="middle">Detecta los UTM entrantes</text>

  <line x1="330" y1="203" x2="358" y2="203" class="arr" marker-end="url(#arrow)"/>

  <rect x="360" y="175" width="220" height="56" rx="10" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
  <text class="th" x="470" y="197" text-anchor="middle">Reescribe los links</text>
  <text class="ts" x="470" y="215" text-anchor="middle">Añade los UTM al href</text>

  <line x1="220" y1="231" x2="220" y2="270" class="arr" marker-end="url(#arrow)" opacity="0.5"/>
  <text class="ts" x="220" y="285" text-anchor="middle">Botón "Ver más" en la página</text>

  <line x1="340" y1="300" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>

  <!-- Row 3: Clic en el link -->
  <rect x="250" y="340" width="180" height="44" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.5"/>
  <text class="th" x="340" y="366" text-anchor="middle">Usuario hace clic</text>

  <line x1="340" y1="384" x2="340" y2="410" class="arr" marker-end="url(#arrow)"/>

  <!-- Row 4: Dominio final -->
  <rect x="220" y="420" width="240" height="56" rx="10" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="0.5"/>
  <text class="th" x="340" y="442" text-anchor="middle">Dominio final</text>
  <text class="ts" x="340" y="460" text-anchor="middle">Llega con los mismos UTM</text>
</svg>
